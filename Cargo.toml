[package]
name = "cargo-template"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = {  version = "0.4", features = ["serde"] }
dirs = "7"
log = "0.4"
simplelog = "0.12"
rand = "0.10"
derive-getters = "0.5"
owo-colors = "4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = {  version = "1", features = ["serde"] }
derive-new = "0.7"
